<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DevTimeCapsule v2 — NLP Prototype</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="left panel">
            <label for="pkgInput" class="subtitle">Paste package.json</label>
            <textarea id="pkgInput" placeholder='{"name":"my-app","dependencies":{},"devDependencies":{}}'
                aria-label="Package.json input"></textarea>
            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success"></div>
            <div class="controls">
                <button id="analyzeBtn" class="primary">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    <span class="btn-text">Analyze</span>
                    <div class="loader white"></div>
                </button>
                <button id="loadExample" class="secondary">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span class="btn-text">Load Example</span>
                </button>
                <button id="clearBtn" class="secondary">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span class="btn-text">Clear</span>
                </button>
            </div>
            <div class="input-wrapper">
                <svg class="input-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                </svg>
                <input id="ghUrl" class="search" placeholder="GitHub repo (user/repo)">
            </div>

            <div class="panel" style="margin-top:16px;">
                <div class="input-wrapper" style="margin-top:0;">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input id="searchBox" class="search" placeholder="Search package name">
                </div>
                <div class="filters" id="filterButtons"></div>
                <div id="pkgGrid" class="pkg-grid">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            style="width:48px;height:48px;margin:0 auto;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                        </svg>
                        <div>No packages analyzed yet</div>
                    </div>
                </div>
            </div>
        </div>

        <aside class="right">
            <div class="panel">
                <div
                    style="font-weight:600;margin-bottom:20px;font-size:14px;color:#000;text-transform:uppercase;letter-spacing:0.5px;">
                    Summary</div>
                <div id="statsGrid" class="stats">
                    <div class="stat-card">
                        <div class="stat-value black">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value green">0</div>
                        <div class="stat-label">Current</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value red">0</div>
                        <div class="stat-label">Outdated</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value black">0%</div>
                        <div class="stat-label">Health</div>
                    </div>
                </div>
                <div id="insights" style="margin-top:16px;">
                    <div class="insight-item black">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Analyze a package.json to see insights</span>
                    </div>
                </div>
            </div>
        </aside>

        <footer>
            <svg fill="currentColor" viewBox="0 0 24 24"
                style="width:16px;height:16px;display:inline;vertical-align:middle;margin-right:6px;">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
            Developed by Pineapple with love
        </footer>
    </div>

    <script src="script.js"></script>

</body>

</html>
