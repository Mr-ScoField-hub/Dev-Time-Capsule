<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTimeCapsule v2 — Package Analyzer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f1724 0%, #1a2332 100%);
            color: #e6eef6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .input-section {
            background: #1a2332;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #0a1120;
            color: #e6eef6;
            border: 2px solid #2d3748;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #06b6d4;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: #0a1120;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: #334155;
        }

        .secondary-btn:hover {
            box-shadow: 0 4px 12px rgba(51, 65, 85, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1a2332;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px solid #2d3748;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .section {
            background: #1a2332;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .section h2 {
            margin-top: 0;
            color: #06b6d4;
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .package-grid {
            display: grid;
            gap: 12px;
        }

        .package-item {
            background: #0a1120;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #06b6d4;
            transition: transform 0.2s, border-color 0.2s;
        }

        .package-item:hover {
            transform: translateX(4px);
            border-color: #3b82f6;
        }

        .pkg-name {
            color: #38bdf8;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .pkg-version {
            color: #64748b;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .pkg-desc {
            color: #cbd5e1;
            margin-top: 8px;
            line-height: 1.5;
        }

        .pkg-category {
            display: inline-block;
            background: #334155;
            color: #94a3b8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #dc2626;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: #0a1120;
            border: 2px solid #2d3748;
            border-radius: 8px;
            color: #e6eef6;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .search-box:focus {
            outline: none;
            border-color: #06b6d4;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .example-link {
            color: #06b6d4;
            cursor: pointer;
            text-decoration: underline;
        }

        .example-link:hover {
            color: #3b82f6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>DevTimeCapsule v2</h1>
        <p class="subtitle">Analyze and understand your project dependencies</p>

        <div class="input-section">
            <label for="pkgInput" style="display: block; margin-bottom: 8px; font-weight: 600;">Paste your
                package.json:</label>
            <textarea id="pkgInput" placeholder='{ "name": "my-project", "dependencies": { ... } }'></textarea>
            <div class="button-group">
                <button id="parseBtn">🔍 Analyze Dependencies</button>
                <button class="secondary-btn" id="clearBtn">Clear</button>
                <button class="secondary-btn" id="exampleBtn">Load Example</button>
            </div>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const parseBtn = document.getElementById('parseBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exampleBtn = document.getElementById('exampleBtn');
        const pkgInput = document.getElementById('pkgInput');
        const output = document.getElementById('output');

        const packageDatabase = {
            // React ecosystem
            "react": { desc: "A declarative JavaScript library for building user interfaces with component-based architecture", category: "UI Framework" },
            "react-dom": { desc: "Provides DOM-specific methods for rendering React components in web browsers", category: "UI Framework" },
            "react-native": { desc: "Framework for building native mobile apps using React", category: "Mobile" },
            "next": { desc: "Production-ready React framework with server-side rendering and static site generation", category: "Framework" },
            "gatsby": { desc: "React-based static site generator optimized for performance", category: "Framework" },

            // Vue ecosystem
            "vue": { desc: "Progressive JavaScript framework for building user interfaces", category: "UI Framework" },
            "nuxt": { desc: "Vue.js framework for creating universal applications", category: "Framework" },
            "vuex": { desc: "State management pattern and library for Vue.js applications", category: "State Management" },

            // Build tools
            "vite": { desc: "Next-generation frontend build tool with lightning-fast HMR and optimized builds", category: "Build Tool" },
            "webpack": { desc: "Module bundler that compiles JavaScript modules and assets", category: "Build Tool" },
            "rollup": { desc: "Module bundler optimized for library development", category: "Build Tool" },
            "parcel": { desc: "Zero-configuration web application bundler", category: "Build Tool" },
            "esbuild": { desc: "Extremely fast JavaScript bundler and minifier", category: "Build Tool" },
            "turbopack": { desc: "Incremental bundler optimized for JavaScript and TypeScript", category: "Build Tool" },

            // TypeScript
            "typescript": { desc: "Typed superset of JavaScript that compiles to plain JavaScript, adding static type checking", category: "Language" },
            "@types/react": { desc: "TypeScript type definitions for React", category: "Types" },
            "@types/node": { desc: "TypeScript type definitions for Node.js", category: "Types" },

            // Styling
            "tailwindcss": { desc: "Utility-first CSS framework for rapid UI development with composable classes", category: "Styling" },
            "sass": { desc: "CSS preprocessor with variables, nesting, and mixins", category: "Styling" },
            "styled-components": { desc: "CSS-in-JS library for styling React components with tagged template literals", category: "Styling" },
            "emotion": { desc: "Performant CSS-in-JS library with composable styles", category: "Styling" },
            "postcss": { desc: "Tool for transforming CSS with JavaScript plugins", category: "Styling" },
            "autoprefixer": { desc: "PostCSS plugin that adds vendor prefixes to CSS", category: "Styling" },

            // Animation
            "framer-motion": { desc: "Production-ready motion library for React with spring physics and gesture support", category: "Animation" },
            "gsap": { desc: "Professional-grade animation library for complex sequences", category: "Animation" },
            "react-spring": { desc: "Spring-physics based animation library for React", category: "Animation" },

            // Forms & Validation
            "react-hook-form": { desc: "Performant, flexible forms with easy validation using React hooks", category: "Forms" },
            "formik": { desc: "Popular form library for React with built-in validation", category: "Forms" },
            "zod": { desc: "TypeScript-first schema validation with static type inference", category: "Validation" },
            "yup": { desc: "JavaScript schema builder for value parsing and validation", category: "Validation" },
            "@hookform/resolvers": { desc: "Validation resolvers for React Hook Form (supports Zod, Yup, Joi, etc.)", category: "Forms" },

            // State Management
            "redux": { desc: "Predictable state container for JavaScript apps", category: "State Management" },
            "@reduxjs/toolkit": { desc: "Official, opinionated Redux toolset for efficient development", category: "State Management" },
            "zustand": { desc: "Small, fast state management solution with hooks", category: "State Management" },
            "jotai": { desc: "Primitive and flexible state management for React", category: "State Management" },
            "recoil": { desc: "State management library for React with atom-based architecture", category: "State Management" },
            "mobx": { desc: "Simple, scalable state management with reactive programming", category: "State Management" },

            // UI Components
            "@radix-ui/react-accordion": { desc: "Accessible accordion component primitive from Radix UI", category: "UI Components" },
            "@radix-ui/react-dialog": { desc: "Accessible modal dialog component primitive", category: "UI Components" },
            "@mui/material": { desc: "Material Design components for React", category: "UI Components" },
            "antd": { desc: "Enterprise-class UI design system for React", category: "UI Components" },
            "chakra-ui": { desc: "Simple, modular and accessible component library for React", category: "UI Components" },

            // Data Fetching
            "axios": { desc: "Promise-based HTTP client for browsers and Node.js", category: "HTTP" },
            "swr": { desc: "React hooks for data fetching with caching and revalidation", category: "Data Fetching" },
            "react-query": { desc: "Powerful data synchronization for React applications", category: "Data Fetching" },
            "@tanstack/react-query": { desc: "Powerful async state management for React (formerly react-query)", category: "Data Fetching" },

            // Routing
            "react-router-dom": { desc: "Declarative routing for React web applications", category: "Routing" },
            "react-router": { desc: "Core routing library for React", category: "Routing" },

            // Charts & Visualization
            "recharts": { desc: "Composable charting library built on React components", category: "Data Viz" },
            "chart.js": { desc: "Simple yet flexible JavaScript charting library", category: "Data Viz" },
            "d3": { desc: "Data-driven documents library for powerful visualizations", category: "Data Viz" },
            "victory": { desc: "Composable React components for building interactive data visualizations", category: "Data Viz" },

            // Utilities
            "lodash": { desc: "Modern JavaScript utility library delivering modularity and performance", category: "Utilities" },
            "date-fns": { desc: "Modern JavaScript date utility library with immutable functions", category: "Date/Time" },
            "dayjs": { desc: "Fast 2kB alternative to Moment.js with the same API", category: "Date/Time" },
            "clsx": { desc: "Tiny utility for constructing className strings conditionally", category: "Utilities" },
            "classnames": { desc: "Utility for conditionally joining CSS class names", category: "Utilities" },
            "uuid": { desc: "Generate RFC-compliant UUIDs in JavaScript", category: "Utilities" },

            // Testing
            "jest": { desc: "Delightful JavaScript testing framework with focus on simplicity", category: "Testing" },
            "vitest": { desc: "Blazing fast unit test framework powered by Vite", category: "Testing" },
            "@testing-library/react": { desc: "Simple and complete React testing utilities", category: "Testing" },
            "cypress": { desc: "Fast, easy and reliable testing for anything that runs in a browser", category: "Testing" },
            "playwright": { desc: "Cross-browser end-to-end testing framework", category: "Testing" },

            // Linting & Formatting
            "eslint": { desc: "Pluggable linting utility for JavaScript and JSX", category: "Code Quality" },
            "prettier": { desc: "Opinionated code formatter supporting many languages", category: "Code Quality" },
            "@typescript-eslint/eslint-plugin": { desc: "ESLint plugin for TypeScript-specific rules", category: "Code Quality" },

            // Server & API
            "express": { desc: "Fast, unopinionated web framework for Node.js", category: "Backend" },
            "fastify": { desc: "Fast and low overhead web framework for Node.js", category: "Backend" },
            "graphql": { desc: "Query language for APIs and runtime for executing queries", category: "API" },
            "apollo-server": { desc: "GraphQL server for Node.js", category: "API" },
            "trpc": { desc: "End-to-end typesafe APIs with TypeScript", category: "API" },

            // Plugins
            "vite-plugin-react-swc": { desc: "Vite plugin for React using the super-fast SWC compiler", category: "Plugin" },
            "@vitejs/plugin-react": { desc: "Official Vite plugin for React with Fast Refresh", category: "Plugin" }
        };

        function describePackage(pkg) {
            const info = packageDatabase[pkg];
            if (info) return info;

            if (pkg.startsWith('@types/')) return { desc: `TypeScript type definitions for ${pkg.replace('@types/', '')}`, category: "Types" };
            if (pkg.includes('eslint-')) return { desc: "ESLint configuration or plugin", category: "Code Quality" };
            if (pkg.includes('vite-plugin-')) return { desc: "Plugin for Vite build tool", category: "Plugin" };
            if (pkg.includes('webpack-')) return { desc: "Plugin or loader for Webpack", category: "Plugin" };
            if (pkg.startsWith('@radix-ui/')) return { desc: "Accessible UI component primitive from Radix UI", category: "UI Components" };

            return { desc: "JavaScript/Node.js package", category: "Other" };
        }

        function renderPackages(packages, title, description) {
            let html = `<div class="section">
                <h2>${title}</h2>
                <p style="color: #94a3b8; margin-bottom: 20px;">${description}</p>
                <input type="text" class="search-box" placeholder="🔍 Search packages..." onkeyup="filterPackages(this, '${title}')">
                <div class="package-grid" id="grid-${title}">`;

            Object.entries(packages).forEach(([name, version]) => {
                const info = describePackage(name);
                html += `
                    <div class="package-item" data-name="${name.toLowerCase()}" data-desc="${info.desc.toLowerCase()}">
                        <div class="pkg-name">${name}</div>
                        <div class="pkg-version">${version}</div>
                        <div class="pkg-desc">${info.desc}</div>
                        <span class="pkg-category">${info.category}</span>
                    </div>`;
            });

            html += `</div></div>`;
            return html;
        }

        window.filterPackages = function (input, title) {
            const filter = input.value.toLowerCase();
            const grid = document.getElementById(`grid-${title}`);
            const items = grid.getElementsByClassName('package-item');

            Array.from(items).forEach(item => {
                const name = item.getAttribute('data-name');
                const desc = item.getAttribute('data-desc');
                if (name.includes(filter) || desc.includes(filter)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        };

        parseBtn.addEventListener('click', () => {
            output.innerHTML = '';
            let data;
            try {
                data = JSON.parse(pkgInput.value);
            } catch (e) {
                output.innerHTML = `<div class="error"><strong>Invalid JSON:</strong> ${e.message}</div>`;
                return;
            }

            const deps = data.dependencies || {};
            const devDeps = data.devDependencies || {};
            const totalCount = Object.keys(deps).length + Object.keys(devDeps).length;

            if (totalCount === 0) {
                output.innerHTML = `<div class="empty-state">
                    <h3>No dependencies found</h3>
                    <p>Try loading an <span class="example-link" onclick="document.getElementById('exampleBtn').click()">example package.json</span></p>
                </div>`;
                return;
            }

            // Stats
            output.innerHTML = `<div class="stats">
                <div class="stat-card">
                    <div class="stat-number">${totalCount}</div>
                    <div class="stat-label">Total Packages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${Object.keys(deps).length}</div>
                    <div class="stat-label">Dependencies</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${Object.keys(devDeps).length}</div>
                    <div class="stat-label">Dev Dependencies</div>
                </div>
            </div>`;

            if (Object.keys(deps).length) {
                output.innerHTML += renderPackages(deps, "Dependencies",
                    "These packages are required for your application to run in production.");
            }

            if (Object.keys(devDeps).length) {
                output.innerHTML += renderPackages(devDeps, "Dev Dependencies",
                    "These packages are used during development for building, testing, and code quality.");
            }
        });

        clearBtn.addEventListener('click', () => {
            pkgInput.value = '';
            output.innerHTML = '';
        });

        exampleBtn.addEventListener('click', () => {
            const example = {
                "name": "my-awesome-app",
                "version": "1.0.0",
                "dependencies": {
                    "react": "^18.2.0",
                    "react-dom": "^18.2.0",
                    "react-router-dom": "^6.14.0",
                    "axios": "^1.4.0",
                    "zustand": "^4.3.9",
                    "framer-motion": "^10.12.18",
                    "tailwindcss": "^3.3.3",
                    "clsx": "^2.0.0",
                    "date-fns": "^2.30.0",
                    "recharts": "^2.7.2",
                    "react-hook-form": "^7.45.2",
                    "zod": "^3.21.4",
                    "@hookform/resolvers": "^3.1.1"
                },
                "devDependencies": {
                    "vite": "^4.4.7",
                    "typescript": "^5.1.6",
                    "@types/react": "^18.2.15",
                    "@types/react-dom": "^18.2.7",
                    "eslint": "^8.45.0",
                    "prettier": "^3.0.0",
                    "@vitejs/plugin-react": "^4.0.3",
                    "autoprefixer": "^10.4.14",
                    "postcss": "^8.4.27"
                }
            };
            pkgInput.value = JSON.stringify(example, null, 2);
            parseBtn.click();
        });
    </script>
</body>

</html>
