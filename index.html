<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTimeCapsule v2 — Package Analyzer</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="container">
        <header>
            <h1>DevTimeCapsule v2</h1>
            <p class="subtitle">Analyze and understand your project dependencies</p>
        </header>

        <section class="input-section">
            <label for="pkgInput" class="input-label">Paste your package.json:</label>
            <textarea id="pkgInput" placeholder='{ "name": "my-project", "dependencies": { ... } }'></textarea>
            <div class="button-group">
                <button id="parseBtn">Analyze Dependencies</button>
                <button class="secondary-btn" id="clearBtn">Clear</button>
                <button class="secondary-btn" id="exampleBtn">Load Example</button>
            </div>
        </section>

        <section id="output"></section>
    </main>

    <script defer src="script.js"></script>
</body>

</html>
